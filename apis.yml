aid: junto-education
name: Junto Education
description: >-
  Junto is a Berlin-based leadership-development company and a portfolio company
  of Earlybird Venture Capital. Junto delivers cohort-based, live and interactive
  online training led by certified coaches who previously held senior leadership
  roles at leading technology companies. Its programs combine the accountability
  and personal interaction of offline training with the scalability of online
  learning, and cover first-time managers, high-performance teams, and custom
  leadership tracks. Junto sells directly to organizations, who nominate
  high-potential employees for the programs. Junto operates a marketing site at
  junto.eu and a customer learning application at app.junto.eu. As of this
  profile, Junto publishes no public API, developer portal, or SDKs.
